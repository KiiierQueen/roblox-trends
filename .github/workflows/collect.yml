name: Сбор данных и сайт

on:
  schedule:
    - cron: "7 * * * *"     # раз в час
  workflow_dispatch:         # кнопка «Run workflow»
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Взять базу из ветки data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:tracker.db > data/tracker.db
            echo "база: $(du -h data/tracker.db | cut -f1)"
          else
            echo "базы ещё нет — первый запуск"
          fi

      - name: Собрать данные
        run: python run.py collect || echo "::warning::сбор не удался, сайт обновится со старыми данными"

      - name: Сохранить базу в ветку data
        run: |
          rm -rf /tmp/d && mkdir /tmp/d && cp data/tracker.db /tmp/d/
          cd /tmp/d
          git init -q -b data
          git add tracker.db
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Собрать сайт
        run: python export_static.py site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
