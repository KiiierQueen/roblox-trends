name: Сбор данных и сайт

on:
  schedule:
    - cron: "7 * * * *"     # раз в час
  workflow_dispatch:         # кнопка «Run workflow»
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Взять базу из ветки data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            if git cat-file -e origin/data:tracker.db.gz.enc 2>/dev/null; then
              git show origin/data:tracker.db.gz.enc > /tmp/tracker.db.gz.enc
              python vault.py dec /tmp/tracker.db.gz.enc data/tracker.db.gz
              gunzip -f data/tracker.db.gz
            elif git cat-file -e origin/data:tracker.db.enc 2>/dev/null; then
              git show origin/data:tracker.db.enc > /tmp/tracker.db.enc
              python vault.py dec /tmp/tracker.db.enc data/tracker.db
            else
              git show origin/data:tracker.db > data/tracker.db   # старая незашифрованная база
            fi
            echo "база: $(du -h data/tracker.db | cut -f1)"
          else
            echo "базы ещё нет — первый запуск"
          fi

      - name: Собрать данные
        run: python run.py collect || echo "::warning::сбор не удался, сайт обновится со старыми данными"

      - name: Сохранить базу в ветку data
        run: |
          rm -rf /tmp/d && mkdir /tmp/d
          if [ -n "$SITE_PASSWORD" ]; then
            gzip -9 -c data/tracker.db > /tmp/tracker.db.gz
            python vault.py enc /tmp/tracker.db.gz /tmp/d/tracker.db.gz.enc
          else
            cp data/tracker.db /tmp/d/
          fi
          cd /tmp/d
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          echo "база: $(du -h ${GITHUB_WORKSPACE}/data/tracker.db | cut -f1), в GitHub после сжатия: $(du -h /tmp/d/* | cut -f1)"

      - name: Собрать сайт
        run: python export_static.py site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
